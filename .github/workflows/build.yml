name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: choco install openssl -y --no-progress

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1

