name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: choco install openssl -y --no-progress

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts\build.ps1

      - name: Create Windows installer
        run: powershell -ExecutionPolicy Bypass -File scripts\package.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CastToPC-Setup-${{ github.sha }}
          path: out/installer/CastToPC-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub release installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/installer/CastToPC-Setup-*.exe

